    <script>
      (function () {
        try {
          document.documentElement.dataset.motion = window.matchMedia(
            '(prefers-reduced-motion: reduce)',
          ).matches
            ? 'off'
            : 'on'
        } catch (error) {
          document.documentElement.dataset.motion = 'off'
        }
      })()
    </script>
